AWSTemplateFormatVersion: "2010-09-09"
# 基础栈：两个可用区的 VPC（公有 / 应用私有 / 数据库私有子网）、NAT、RDS PostgreSQL、SSH 跳板机、
# 应用密钥和 Lambda 部署产物桶。本地手动部署，应用栈（Lambda + HTTP API）通过导出值引用这里的资源。
# 会上传到 AWS 的说明文字（Description、参数说明、输出说明）用英文：中文在 CloudFormation 里会变成 ???。
Description: >-
  zyk-aws-admin base stack: two-AZ VPC (public / app private / DB private subnets), NAT,
  RDS PostgreSQL, SSH bastion, app secret and Lambda artifacts bucket. Deployed manually;
  the app stack (Lambda + HTTP API) imports its exports.

# 结构（每个可用区一套，共两套）：
#   公有子网      → 互联网网关；放 NAT 网关和跳板机
#   应用私有子网  → 本可用区的 NAT；第 4 步 Lambda 放这里，出网调 GitHub API
#   数据库私有子网 → 没有出网路由；放 RDS
# 安全组：跳板机 22/443（SSH）只放行 SshCidr；数据库 5432 只放行 Lambda 和跳板机安全组。
#
# 数据库为什么是 RDS 而不是架构图里的 Aurora Serverless v2：账户是 AWS 免费计划，
# 免费计划只允许创建 express 配置的 Aurora（不在 VPC 里、经公网网关访问、只能 IAM 认证），
# 和"数据库放私有子网"冲突。升级到付费计划后可以换回 Aurora，网络部分不用改。

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Bastion }
        Parameters: [SshCidr, KeyName, BastionImageId, BastionInstanceType]
      - Label: { default: Network }
        Parameters: [NatGatewayCount]
      - Label: { default: Database }
        Parameters: [DbEngineVersion, DbInstanceClass, DbAllocatedStorage]

Parameters:
  SshCidr:
    Type: String
    # 允许 SSH 到跳板机的来源：你当前的真实公网 IP 加 /32（开代理时 checkip 查到的可能是代理节点 IP）
    Description: Source allowed to SSH to the bastion - your public IP with /32
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/(2[4-9]|3[0-2])$
    ConstraintDescription: must be an IPv4 CIDR from /24 to /32, e.g. 203.0.113.7/32
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: izyk
    # 私钥在本机 ~/.ssh/izyk.pem
    Description: EC2 key pair for bastion SSH
  BastionImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Bastion AMI, latest Amazon Linux 2023 arm64 by default
  BastionInstanceType:
    Type: String
    Default: t4g.micro
    # 账户是免费计划，只能启动符合免费套餐的机型（t4g.nano 会被拒绝）
    AllowedValues: [t4g.micro, t4g.small]
    Description: Bastion instance type (arm64, free-plan eligible)
  NatGatewayCount:
    Type: Number
    Default: 2
    AllowedValues: [1, 2]
    # 2 = 每个可用区一个 NAT（高可用）；1 = 两个可用区共用一个（省约 $36/月，那个可用区故障时 Lambda 无法出网）
    Description: 2 = one NAT per AZ (HA); 1 = shared NAT (cheaper, no egress if its AZ fails)
  DbEngineVersion:
    Type: String
    Default: "18.6"
    AllowedPattern: ^18\.\d+$
    # 和本地开发库一致；大版本固定 18（参数组族 postgres18）
    Description: PostgreSQL engine version (major version fixed at 18)
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]
    # db.t4g.micro（2 vCPU、1GB 内存）属于免费套餐
    Description: Database instance class
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    # gp3 最小 20；免费套餐含 20GB
    Description: Database storage in GB

Conditions:
  TwoNatGateways: !Equals [!Ref NatGatewayCount, 2]

Resources:
  # ---------------------------------------------------------------- 网络
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.0.0/24
      # 不自动分配公网 IP：只有跳板机显式要了公网 IP，NAT 用弹性 IP
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public-a" }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public-b" }

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.10.0/24
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-app-a" }

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.0.11.0/24
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-app-b" }

  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.0.20.0/24
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-db-a" }

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.0.21.0/24
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-db-b" }

  # 公有子网：默认路由走互联网网关
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # NAT：A 一定有；B 只在 NatGatewayCount=2 时创建
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-nat-a" }

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-nat-a" }

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: TwoNatGateways
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-nat-b" }

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: TwoNatGateways
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-nat-b" }

  # 应用私有子网：每个可用区一张路由表，默认路由走本可用区的 NAT（只有一个 NAT 时都走 A）
  AppRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-app-a" }

  AppDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  AppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref AppRouteTableA

  AppRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-app-b" }

  AppDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [TwoNatGateways, !Ref NatGatewayB, !Ref NatGatewayA]

  AppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref AppRouteTableB

  # 数据库子网：路由表只有 VPC 内部路由，不能出网也不能被外网访问
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-db" }

  DbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetA
      RouteTableId: !Ref DbRouteTable

  DbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetB
      RouteTableId: !Ref DbRouteTable

  # ---------------------------------------------------------------- 安全组
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bastion - SSH from SshCidr only
      VpcId: !Ref Vpc
      # sshd 同时监听 22 和 443：有些网络封了出站 22 端口（2026-11 用户当前网络就是），443 几乎不会被封
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
          Description: SSH from operator IP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref SshCidr
          Description: SSH on 443 from operator IP (networks that block outbound 22)
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-bastion" }

  # 放在基础栈而不是应用栈：数据库安全组要引用它，放应用栈会形成两个栈互相依赖
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API Lambda - no ingress, egress to DB and internet via NAT
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-lambda" }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS - PostgreSQL from Lambda and bastion only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: PostgreSQL from API Lambda
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          Description: PostgreSQL from bastion (migrations, admin)
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-db" }

  # ---------------------------------------------------------------- 数据库
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: RDS - private DB subnets in two AZs
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]

  # 强制 TLS：客户端必须用 SSL 连接
  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: zyk-aws-admin PostgreSQL 18 - force SSL
      Family: postgres18
      Parameters:
        rds.force_ssl: "1"

  # 单可用区实例（和跳板机同在 A 区）。实例故障时要等 AWS 恢复；要高可用可设 MultiAZ: true（费用翻倍，免费套餐不含）
  Database:
    Type: AWS::RDS::DBInstance
    # 删栈或被替换时自动留一份快照，数据不会直接丢
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: zyk_aws_admin
      # 主账号只给运维用（经跳板机），密码由 RDS 生成、存进 Secrets Manager 并自动轮换；
      # 应用用第 3 步另建的专用账号
      MasterUsername: zyk_admin
      ManageMasterUserPassword: true
      DBParameterGroupName: !Ref DbParameterGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MultiAZ: false
      PubliclyAccessible: false
      # 不开存储自动扩容：免费套餐只含 20GB
      StorageType: gp3
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageEncrypted: true
      # 免费计划不允许 7 天备份（Aurora 报过 exceeds the maximum available to free tier customers），
      # 先用最小值 1 天；升级付费计划后改回 7
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports: [postgresql]

  # ---------------------------------------------------------------- 应用密钥
  # Lambda 运行需要的敏感配置。创建时只自动生成 BETTER_AUTH_SECRET；
  # DATABASE_URL（应用专用账号）和 GITHUB_TOKEN 在第 3 步用 put-secret-value 填入。
  # 注意：不要修改 GenerateSecretString，改了会重新生成整个值，覆盖掉已填的内容。
  # 删栈时一起删除（Secrets Manager 默认保留 30 天可恢复）；用 Retain 的话首次部署失败回滚会留下它，
  # 名字被占用导致下次部署失败
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub "${AWS::StackName}/app"
      Description: zyk-aws-admin API Lambda runtime secrets
      GenerateSecretString:
        SecretStringTemplate: '{"DATABASE_URL":"","GITHUB_TOKEN":""}'
        GenerateStringKey: BETTER_AUTH_SECRET
        PasswordLength: 48
        ExcludePunctuation: true

  # ---------------------------------------------------------------- 部署产物
  # 存 Lambda 代码包，供应用栈部署使用。内容随时可以重新构建，所以删栈时一起删除
  # （桶里有文件时删栈会失败，要先清空）
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # 旧代码包只在回滚时有用，90 天后清理
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub "${ArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------- 跳板机
  # 只用 SSH 登录，不挂 IAM 角色（机器上拿不到任何 AWS 权限）。
  # 逻辑 ID 从 BastionInstance 改成 BastionHost 是为了让 CloudFormation 换一台新机器：
  # UserData 只在首次开机执行，改了它旧机器不会重跑。跳板机不存数据，随时可以替换
  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref BastionImageId
      InstanceType: !Ref BastionInstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref PublicSubnetA
          AssociatePublicIpAddress: true
          GroupSet: [!Ref BastionSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # sshd 同时监听 22 和 443（有些网络封了出站 22）；AL2023 的 SELinux 默认 permissive，不用额外放行端口
          printf 'Port 22\nPort 443\n' > /etc/ssh/sshd_config.d/10-ports.conf
          systemctl restart sshd
          # 装 psql 客户端，方便在跳板机上直接排查数据库
          dnf -y upgrade --security
          for v in 18 17 16; do dnf -y install "postgresql$v" && break; done
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-bastion" }

  # 固定公网 IP：本机 SSH 配置和代理规则只写一次。运行时和自动分配的 IP 同价（约 $3.6/月），
  # 区别是停机后弹性 IP 仍然计费
  BastionEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref BastionHost
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-bastion" }

Outputs:
  VpcId:
    Description: VPC
    Value: !Ref Vpc

  AppSubnetIds:
    Description: App private subnets for Lambda, comma-separated
    Value: !Join [",", [!Ref AppSubnetA, !Ref AppSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-AppSubnetIds"

  LambdaSecurityGroupId:
    Description: Lambda security group
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-LambdaSecurityGroupId"

  AppSecretArn:
    Description: App secret (BETTER_AUTH_SECRET / DATABASE_URL / GITHUB_TOKEN)
    Value: !Ref AppSecret
    Export:
      Name: !Sub "${AWS::StackName}-AppSecretArn"

  ArtifactsBucketName:
    Description: Lambda artifacts bucket
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ArtifactsBucketName"

  DbEndpoint:
    Description: Database endpoint (reachable only inside the VPC)
    Value: !GetAtt Database.Endpoint.Address

  DbPort:
    Description: Database port
    Value: !GetAtt Database.Endpoint.Port

  DbMasterSecretArn:
    Description: Database master password secret (managed by RDS)
    Value: !GetAtt Database.MasterUserSecret.SecretArn

  BastionInstanceId:
    Description: Bastion instance
    Value: !Ref BastionHost

  BastionPublicIp:
    Description: Bastion Elastic IP (SSH on port 22 or 443)
    Value: !Ref BastionEip
